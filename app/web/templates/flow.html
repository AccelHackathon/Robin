{% extends 'base.html' %}{% block content %}<section class="flow"><div class="flow-top"><a class="back" href="{{ ['/', '/onboarding/business', '/onboarding/documents', '/onboarding/mandate'][step] }}">← Back{% if step == 0 %} to home{% endif %}</a><div class="progress" aria-label="Step {{ step + 1 }} of 4">{% for i in range(4) %}<i class="{% if i <= step %}done{% endif %}"></i>{% endfor %}</div></div><div class="flow-heading"><h1>{% block heading %}{% endblock %}</h1><p>{% block description %}{% endblock %}</p></div><div class="paper">{% if error %}<div class="error-notice" role="alert">{{ error }}</div>{% endif %}{% block form %}{% endblock %}</div></section>{% endblock %}
